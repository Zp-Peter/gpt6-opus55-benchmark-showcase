<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>五个 3D 个人站</title>
<style>
:root{color-scheme:dark;--bg:#0e0f13;--ink:#eceae4;--dim:#8a8d99;--line:rgba(236,234,228,.14)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"PingFang SC","Noto Sans SC",sans-serif;padding:48px clamp(16px,5vw,64px)}
h1{font-size:clamp(28px,4vw,44px);margin:0 0 6px;letter-spacing:-.01em}
p{color:var(--dim);margin:0 0 32px}
.list{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);max-width:960px}
a{display:grid;grid-template-columns:48px 1fr auto;gap:18px;align-items:center;padding:20px 22px;background:var(--bg);color:inherit;text-decoration:none;transition:background .2s}
a:hover{background:#171922}
a i{width:40px;height:40px;border-radius:10px;display:block}
a b{display:block;font-size:18px}
a span{color:var(--dim);font-size:13px}
a em{font-style:normal;color:var(--dim);font-size:12px;font-family:ui-monospace,monospace}
</style>
<h1>五个 3D 个人站</h1>
<p>每个站点都是单文件 HTML，3D 由 Three.js 实时渲染。</p>
