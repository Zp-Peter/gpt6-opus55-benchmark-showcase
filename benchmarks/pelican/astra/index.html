<div class="controls"><div class="actions"><button class="primary" id="toggle" aria-label="暂停动画"><svg id="toggle-icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M3 2h3v12H3zm7 0h3v12h-3z"/></svg><span id="toggle-label">歇一会儿</span></button><button id="bell" aria-label="按响自行车铃铛"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 13h12l-2-3V7a4 4 0 0 0-8 0v3zm4 3q2 3 4 0M10 1v2"/></svg>叮铃</button></div><div class="speed"><label for="speed">骑行速度</label><input id="speed" type="range" min="0.5" max="2" step="0.25" value="1"><output id="speed-value" for="speed">1×</output></div><span class="status" id="status"><i class="dot"></i>海风正好，慢慢来</span></div>
<footer><span>给匆忙的生活，留一点兜风的时间。</span><span>纯 SVG 手绘 · 循环小动画</span></footer>

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), motion=matchMedia('(prefers-reduced-motion: reduce)');
let playing=!motion.matches,speed=1,t=0,last=0,bellUntil=0,audio;
const set=(id,a,v)=>$(id).setAttribute(a,v);
function foot(id,x,y){set(id,'d',`M${x-12} ${y-10}q5-9 12-3l18 6 5 7h-37Z`)}
function draw(){
 const a=t*2.8,cx=530,cy=477,r=29,x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r,fx=2*cx-x,fy=2*cy-y;
 const deg=a*180/Math.PI*1.55;
 set('rear-wheel','transform',`rotate(${deg})`);set('front-wheel','transform',`rotate(${deg})`);
 set('crank','d',`M${fx} ${fy}L${x} ${y}`);
 set('near-leg','d',`M513 375Q${492+Math.cos(a)*9} ${413+Math.sin(a)*7} ${x} ${y-9}`);
 set('far-leg','d',`M515 373Q${555-Math.cos(a)*8} ${411-Math.sin(a)*7} ${fx} ${fy-9}`);
 foot('near-foot',x,y);foot('far-foot',fx,fy);
 set('near-pedal','d',`M${x-16} ${y+2}h34`);
 set('rider','transform',`translate(0 ${Math.sin(a*2)*1.3})`);
 set('road','transform',`translate(${-((t*2.8*1.55*83)%1100)} 0)`);
 set('clouds','transform',`translate(${-((t*8)%1200)} 0)`);
 set('ripples','transform',`translate(${Math.sin(t*.5)*15} 0)`);
 set('gull1','transform',`translate(${Math.sin(t*.3)*17} ${Math.sin(t*1.6)*3})`);
 set('gull2','transform',`translate(${Math.sin(t*.25)*-12} ${Math.sin(t*1.7+1)*4})`);
 const flutter=Math.sin(t*7)*5;
 set('scarf-tail','d',`M548 255Q503 ${260+flutter} 466 ${236+flutter}L444 ${244+flutter} 451 ${260+flutter}Q503 ${282+flutter} 548 266Z`);
}
function sync(){ $('toggle-label').textContent=playing?'歇一会儿':'继续出发';$('toggle').setAttribute('aria-label',playing?'暂停动画':'播放动画');$('toggle-icon').innerHTML=playing?'<path d="M3 2h3v12H3zm7 0h3v12h-3z"/>':'<path d="m4 2 10 6-10 6Z"/>';$('status').innerHTML=playing?'<i class="dot"></i>海风正好，慢慢来':'<i class="dot"></i>停一停，看看海';}
$('toggle').addEventListener('click',()=>{playing=!playing;sync()});
$('speed').addEventListener('input',e=>{speed=Number(e.target.value);$('speed-value').textContent=speed+'×'});
$('bell').addEventListener('click',()=>{
 bellUntil=performance.now()+850;
 try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume().catch(()=>{});const start=audio.currentTime;[0,.14].forEach(delay=>{[1397,2095,2794].forEach((freq,i)=>{const osc=audio.createOscillator(),gain=audio.createGain();osc.frequency.value=freq;gain.gain.setValueAtTime(0,start+delay);gain.gain.linearRampToValueAtTime(.09/(i+1),start+delay+.006);gain.gain.exponentialRampToValueAtTime(.0001,start+delay+.7);osc.connect(gain);gain.connect(audio.destination);osc.start(start+delay);osc.stop(start+delay+.75)})})}catch{}
});
motion.addEventListener('change',e=>{playing=!e.matches;sync()});
document.addEventListener('visibilitychange',()=>{last=0});
function frame(now){if(last&&playing&&!document.hidden){t+=Math.min((now-last)/1000,.05)*speed;draw()}last=now;$('bell-marks').style.opacity=now<bellUntil?'1':'0';requestAnimationFrame(frame)}
draw();sync();requestAnimationFrame(frame);
})();
</script>
